# Single-host deployment: persistent PostgreSQL, API, and automatic HTTPS.
# Copy deployment.env.example to .env and configure before starting.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: adgenie
      POSTGRES_USER: adgenie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hex database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adgenie -d adgenie"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+psycopg://adgenie:${POSTGRES_PASSWORD}@db:5432/adgenie
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME:?Set a public hostname}
      CORS_ORIGINS: '["https://${PUBLIC_HOSTNAME}"]'
      MEDIA_STORAGE_DIR: /data/media
      # Caddy is in front and the api service publishes no port of its own.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
