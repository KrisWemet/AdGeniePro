<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdGenie Pro</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e3e3de;
    --accent:#3d5afe; --good:#0f7b4f; --warn:#a86500; --bad:#b3261e;
    --good-bg:#e6f4ec; --warn-bg:#fdf2e0; --bad-bg:#fdeceb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16161a; --panel:#1f1f24; --ink:#ececea; --muted:#9a9a94; --line:#31313a;
      --accent:#8fa2ff; --good:#5fd39b; --warn:#e8b45f; --bad:#ef8b83;
      --good-bg:#12291f; --warn-bg:#2b2313; --bad-bg:#2c1a18;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 28px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  h2{font-size:15px;margin:0 0 12px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  main{padding:24px 28px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .kpi .value{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .scroll{overflow-x:auto}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .t-good{background:var(--good-bg);color:var(--good)}
  .t-warn{background:var(--warn-bg);color:var(--warn)}
  .t-bad{background:var(--bad-bg);color:var(--bad)}
  .t-mute{background:var(--line);color:var(--muted)}
  button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:progress}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .action{border-left:3px solid var(--line);padding:10px 0 10px 12px;margin-bottom:12px}
  .action.pause{border-color:var(--bad)}
  .action.increase_budget{border-color:var(--good)}
  .action.decrease_budget{border-color:var(--warn)}
  .action .head{font-weight:600;margin-bottom:2px}
  .action .why{color:var(--muted);font-size:13px}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .empty{color:var(--muted);padding:20px 0;text-align:center}
  code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AdGenie Pro</h1>
  <span class="sub" id="status">loading…</span>
  <span style="flex:1"></span>
  <div class="row">
    <button id="sync">Sync metrics</button>
    <button id="optimize" class="primary">Run optimizer</button>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel" style="grid-column:1/-1">
      <h2>Creative performance <span class="sub">last 7 days, network-attributed revenue</span></h2>
      <div class="scroll"><table id="perf">
        <thead><tr>
          <th>Creative</th><th>Clicks</th><th>Spend</th><th>Conv</th><th>Revenue</th>
          <th>Profit</th><th>CTR</th><th>EPC</th><th>ROAS</th><th>90% range</th><th>P(profit)</th>
        </tr></thead><tbody></tbody>
      </table></div>
      <div class="empty" id="perf-empty" hidden>
        No delivery yet. Launch a campaign, then sync metrics.
      </div>
    </div>

    <div class="panel">
      <h2>Latest decisions</h2>
      <div id="actions"></div>
    </div>

    <div class="panel">
      <h2>Campaigns</h2>
      <div class="scroll"><table id="camps">
        <thead><tr><th>Name</th><th>Platform</th><th>Budget</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);

// Offer names, creative names and optimizer reasons all originate from user
// input and end up in innerHTML. Escaping them here is what stops an offer
// named "<img onerror=...>" from running script in the operator's dashboard.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined,
  {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => (n*100).toFixed(2) + "%";

// Set by an operator when the deployment requires a key:
//   localStorage.setItem("adgenie_api_key", "…")
const API_KEY = (() => { try { return localStorage.getItem("adgenie_api_key"); }
                         catch { return null; } })();

async function api(path, opts){
  opts = {...(opts || {})};
  if(API_KEY) opts.headers = {...(opts.headers || {}), "X-API-Key": API_KEY};
  const r = await fetch("/api" + path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function roasTag(roas){
  const cls = roas >= 1.3 ? "t-good" : roas >= 1.0 ? "t-warn" : "t-bad";
  return `<span class="tag ${cls}">${roas.toFixed(2)}</span>`;
}

async function loadHealth(){
  const h = await api("/health");
  const sim = Object.values(h.platforms).filter(p => p.simulated).length;
  const bits = [
    h.dry_run ? "dry run" : "live spend",
    "copy: " + h.copywriter,
    sim ? `${sim} platform(s) simulated` : "platforms connected",
  ];
  $("#status").textContent = bits.join(" · ");
}

async function loadPerformance(){
  const rows = await api("/performance?level=creative&days=7");
  const tbody = $("#perf tbody");
  tbody.innerHTML = "";
  $("#perf-empty").hidden = rows.length > 0;

  let spend=0, revenue=0, clicks=0, conv=0;
  for(const r of rows){
    spend+=r.spend_usd; revenue+=r.revenue_usd; clicks+=r.clicks; conv+=r.conversions;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${esc(r.name || ("#"+r.entity_id))}</td>
      <td>${r.clicks.toLocaleString()}</td>
      <td>${money(r.spend_usd)}</td>
      <td>${r.conversions}</td>
      <td>${money(r.revenue_usd)}</td>
      <td style="color:${r.profit_usd>=0?"var(--good)":"var(--bad)"}">${money(r.profit_usd)}</td>
      <td>${pct(r.ctr)}</td>
      <td>${money(r.epc_usd)}</td>
      <td>${roasTag(r.roas)}</td>
      <td class="sub">${r.roas_lower.toFixed(2)} – ${r.roas_upper.toFixed(2)}</td>
      <td><div class="bar"><i style="width:${Math.round(r.prob_profitable*100)}%"></i></div></td>`;
    tbody.appendChild(tr);
  }

  const profit = revenue - spend;
  const kpis = [
    ["Spend", money(spend)],
    ["Revenue", money(revenue)],
    ["Profit", money(profit)],
    ["ROAS", spend ? (revenue/spend).toFixed(2) : "—"],
    ["Clicks", clicks.toLocaleString()],
    ["Conversions", conv.toLocaleString()],
    ["EPC", clicks ? money(revenue/clicks) : "—"],
  ];
  $("#kpis").innerHTML = kpis.map(([label,value]) =>
    `<div class="kpi"><div class="label">${esc(label)}</div>` +
    `<div class="value">${esc(value)}</div></div>`
  ).join("");
}

async function loadActions(){
  const actions = await api("/optimizer/actions?limit=12");
  const host = $("#actions");
  if(!actions.length){
    host.innerHTML = `<div class="empty">No decisions yet. Run the optimizer.</div>`;
    return;
  }
  host.innerHTML = actions.map(a => `
    <div class="action ${a.action}">
      <div class="head">${esc(a.action.replace(/_/g," "))}
        <span class="sub">· ${esc(a.level)} #${Number(a.entity_id)}</span>
        ${a.requires_approval ? '<span class="tag t-warn">needs approval</span>' : ""}
        <span class="tag ${a.status==="applied"?"t-good":"t-mute"}">${esc(a.status)}</span>
      </div>
      <div class="why">${esc(a.reason)}</div>
      <div class="sub"><code>${esc(a.rule)}</code>
        ${a.confidence ? " · confidence " + (a.confidence*100).toFixed(0) + "%" : ""}</div>
      ${a.requires_approval && a.status==="proposed"
        ? `<div class="row" style="margin-top:6px">
             <button onclick="approve(${Number(a.id)})">Approve</button>
             <button onclick="reject(${Number(a.id)})">Reject</button>
           </div>` : ""}
    </div>`).join("");
}

async function loadCampaigns(){
  const camps = await api("/campaigns");
  const tbody = $("#camps tbody");
  tbody.innerHTML = camps.length ? "" :
    `<tr><td colspan="4" class="empty">No campaigns yet.</td></tr>`;
  for(const c of camps){
    const tr = document.createElement("tr");
    const cls = c.status==="active" ? "t-good" : c.status==="paused" ? "t-mute" : "t-warn";
    tr.innerHTML = `<td>${esc(c.name)}</td><td>${esc(c.platform)}</td>
      <td>${money(c.daily_budget_usd)}/day</td>
      <td><span class="tag ${cls}">${esc(c.status)}</span></td>`;
    tbody.appendChild(tr);
  }
}

window.approve = async id => { await api(`/optimizer/actions/${id}/approve`, {method:"POST"}); refresh(); };
window.reject  = async id => { await api(`/optimizer/actions/${id}/reject`, {method:"POST"}); refresh(); };

async function withButton(btn, fn){
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "working…";
  try { await fn(); await refresh(); }
  catch(e){ alert(e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}

$("#sync").onclick = e => withButton(e.target,
  () => api("/optimizer/sync", {method:"POST", headers:{"content-type":"application/json"}, body:"{}"}));
$("#optimize").onclick = e => withButton(e.target,
  () => api("/optimizer/run", {method:"POST", headers:{"content-type":"application/json"}, body:"{}"}));

async function refresh(){
  await Promise.all([loadHealth(), loadPerformance(), loadActions(), loadCampaigns()]);
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
