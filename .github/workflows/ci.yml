name: CI

on:
  push:
    branches: [main, "chatgpt/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest tests/
      - name: Validate production preflight entrypoint
        run: python -m adgenie.preflight --help
      - name: Build production container
        run: docker build -t adgenie-pro:test .
