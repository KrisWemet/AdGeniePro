name: CI

on:
  push:
    branches: [main, "chatgpt/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest tests/
      - name: Run end-to-end simulator
        run: python -m adgenie.cli demo --days 3 --budget 10 --database-url sqlite:///./ci-demo.db
      - name: Validate production preflight entrypoint
        run: python -m adgenie.platform_preflight --help
      - name: Validate offer preflight entrypoint
        run: python -m adgenie.cli preflight --help
      - name: Build production container
        run: docker build -t adgenie-pro:test .
